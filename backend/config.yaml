# AdSense Blog Automation Configuration

# Google AdSense Settings
adsense:
  client_id: "ca-pub-XXXXXXXXXXXXXXXX"  # Replace with your AdSense client ID
  slots:
    header: "1234567890"      # Ad slot after introduction
    in_article: "0987654321"  # Ad slot mid-content
    sidebar: "1122334455"     # Ad slot before conclusion

# Automation Settings
automation:
  # Target markets for trending topics
  target_markets:
    - "KR"

  # Number of articles to generate per run
  articles_per_run: 1

  # Article length (word count) - randomized per article for natural variation
  # Increased for AdSense content quality requirements
  min_words: 1500
  max_words: 2500

  # Subreddits to monitor
  subreddits:
    - "technology"
    - "worldnews"
    - "business"
    - "science"

  # HackerNews settings
  hackernews_limit: 10

  # Topic cluster strategy (AdSense-optimized)
  # Core (70%): high CPC, data-driven, E-E-A-T suitable
  # Support (20%): high CPC, practical utility
  # Traffic (10%): low CPC, drives page views
  # Removed: 정치, 사회, 글로벌 사회 (sensitive/ephemeral)
  topic_clusters:
    경제: { weight: 25, tier: core }
    IT·테크: { weight: 25, tier: core }
    글로벌 경제: { weight: 20, tier: core }
    부동산: { weight: 20, tier: support }
    연예: { weight: 5, tier: traffic }
    스포츠: { weight: 5, tier: traffic }

  # Content generation
  content_model: "claude-sonnet-4-5-20250929"
