name: Generate Daily Articles

on:
  schedule:
    # 2026-05-04: 색인 회복 위해 하루 6회 → 3회로 축소.
    # 도메인 권위 낮은 상태에서 발행량 많으면 크롤 예산이 분산됨.
    # GSC 노출/색인 회복 후 다시 늘릴 것.
    - cron: '0 0 * * *'    # KST 09:00 (오전)
    - cron: '0 6 * * *'    # KST 15:00 (오후)
    - cron: '0 13 * * *'   # KST 22:00 (야간)
  workflow_dispatch:
    inputs:
      articles:
        description: 'Number of articles to generate'
        required: false
        default: '2'
      force_topic:
        description: 'Force include this topic (optional)'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Random delay (5~55 min)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$(( (RANDOM % 50) + 5 ))
          echo "Waiting ${DELAY} minutes before starting..."
          sleep ${DELAY}m

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Generate articles
        id: generate
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          USE_SUPABASE: 'true'
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          GOOGLE_INDEXING_SA_KEY: ${{ secrets.GOOGLE_INDEXING_SA_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          cd backend
          FORCE_TOPIC="${{ github.event.inputs.force_topic }}"
          if [ -n "$FORCE_TOPIC" ]; then
            python main.py --articles ${{ github.event.inputs.articles || '2' }} --force-topic "$FORCE_TOPIC" || true
          else
            python main.py --articles ${{ github.event.inputs.articles || '2' }} || true
          fi

      - name: Revalidate frontend cache
        if: success()
        env:
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
        run: |
          echo "Revalidating frontend cache..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://www.nexustopic.com/api/revalidate" \
            -H "Authorization: Bearer $REVALIDATION_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "Response: $HTTP_CODE - $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Revalidation failed with HTTP $HTTP_CODE"
          fi

      - name: Wait for sitemap ISR refresh
        if: success()
        run: |
          echo "Waiting 10s for ISR cache to propagate..."
          sleep 10

      # NOTE 2026-05-04: Removed `batch_index` step. Google Indexing API only
      # supports JobPosting and BroadcastEvent — calling it for news pages was
      # a no-op. IndexNow + sitemap submission below handle Bing/Yandex/Naver
      # immediately and signal Google to recrawl.

      - name: Submit sitemaps to Search Console
        if: success()
        env:
          GOOGLE_INDEXING_SA_KEY: ${{ secrets.GOOGLE_INDEXING_SA_KEY }}
        run: |
          cd backend
          python -m scripts.submit_sitemaps

      - name: Notify IndexNow + WebSub
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd backend
          python -m scripts.notify_search_engines --recent 24 || true

      - name: Summary
        if: always()
        run: |
          echo "## Article Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Date: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- Articles requested: ${{ github.event.inputs.articles || '1' }}" >> $GITHUB_STEP_SUMMARY
