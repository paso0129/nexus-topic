name: Fix Article Content

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Delete 장경태 article (slug 1048)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd backend
          python -c "
          from scripts.database import get_db_client
          db = get_db_client()
          db.client.table('articles').delete().eq('slug', '1048').execute()
          print('Deleted: slug=1048 (장경태 factcheck fail)')
          "

      - name: Fix 코스피 article category (slug 1042)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd backend
          python -c "
          from scripts.database import get_db_client
          db = get_db_client()
          db.update_article('1042', {'topic': '경제'})
          print('Updated: slug=1042 category -> 경제')
          "

      - name: Fix html code block bug in all articles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd backend
          python -c "
          import re
          from scripts.database import get_db_client
          db = get_db_client()

          # Get all published articles
          result = db.client.table('articles').select('slug,title,content').eq('published', True).execute()
          fixed = 0
          for a in result.data:
              content = a.get('content', '') or ''
              if '\`\`\`html' in content or '\`\`\`' in content:
                  # Remove code block wrappers
                  new_content = re.sub(r'\`\`\`html\s*', '', content)
                  new_content = re.sub(r'\`\`\`\s*$', '', new_content)
                  new_content = re.sub(r'^\s*\`\`\`\s*', '', new_content)
                  new_content = new_content.strip()
                  if new_content != content.strip():
                      db.update_article(a['slug'], {'content': new_content})
                      print(f'Fixed code block: slug={a[\"slug\"]} title={a[\"title\"][:40]}')
                      fixed += 1
          print(f'Total fixed: {fixed}')
          "

      - name: Revalidate
        env:
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
        run: |
          curl -s -X POST "https://www.nexustopic.com/api/revalidate" \
            -H "Authorization: Bearer $REVALIDATION_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"all_articles": true}'
