name: Migrate AdSense Quality

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - apply
          - apply-unpublish
          - audit
          - delete-low-quality

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run migration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd backend
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "delete-low-quality" ]; then
            python -c "
import os
from supabase import create_client

supabase = create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_SERVICE_KEY'])

# Get delete candidate IDs: <500 words AND 0 source links
import re
result = supabase.table('articles').select('id, slug, title, content').eq('published', True).execute()
to_delete = []
for a in (result.data or []):
    content = a.get('content', '') or ''
    wc = len(re.sub(r'<[^>]+>', '', content).split())
    sources = len(re.findall(r'<a\s+[^>]*href=[\"'\'']https?://', content))
    if wc < 500 and sources == 0:
        to_delete.append(a)

print(f'Found {len(to_delete)} delete candidates')
for a in to_delete:
    slug = a.get('slug', '')
    title = (a.get('title', '') or '')[:50]
    print(f'  Deleting slug={slug}: {title}')
    supabase.table('articles').delete().eq('id', a['id']).execute()
print(f'Deleted {len(to_delete)} low-quality articles')
"
          elif [ "$MODE" = "audit" ]; then
            python -m scripts.audit_articles
          elif [ "$MODE" = "dry-run" ]; then
            python -m scripts.migrate_adsense_quality --dry-run
          elif [ "$MODE" = "apply-unpublish" ]; then
            python -m scripts.migrate_adsense_quality --unpublish
          else
            python -m scripts.migrate_adsense_quality
          fi
