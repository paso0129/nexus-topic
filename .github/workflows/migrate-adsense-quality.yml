name: Migrate AdSense Quality

on:
  schedule:
    # Weekly audit: Sunday 13:00 UTC = 22:00 KST. Read-only — logs report only.
    - cron: '0 13 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - apply
          - apply-unpublish
          - audit
          - delete-low-quality
          - remove-ai-disclosure

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run migration
        id: migrate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd backend
          # Schedule trigger has no inputs — default to read-only audit
          MODE="${{ github.event.inputs.mode || 'audit' }}"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = "remove-ai-disclosure" ]; then
            python -m scripts.remove_ai_disclosure
          elif [ "$MODE" = "delete-low-quality" ]; then
            python -m scripts.delete_low_quality
          elif [ "$MODE" = "audit" ]; then
            python -m scripts.audit_articles
          elif [ "$MODE" = "dry-run" ]; then
            python -m scripts.migrate_adsense_quality --dry-run
          elif [ "$MODE" = "apply-unpublish" ]; then
            python -m scripts.migrate_adsense_quality --unpublish
          else
            python -m scripts.migrate_adsense_quality
          fi

      - name: Notify Discord
        if: always()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status == 'success' && 'success' || 'failure' }}
          title: "📊 AdSense quality — ${{ steps.migrate.outputs.mode || 'audit' }} (${{ job.status }})"
          message: |
            Mode: `${{ steps.migrate.outputs.mode || 'audit' }}`
            Trigger: `${{ github.event_name }}`
            Full report in the Actions log.
