name: Notify Deleted URLs to Google

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Comma-separated article slugs to send URL_DELETED for'
        required: true

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Send URL_DELETED
        env:
          GOOGLE_INDEXING_SA_KEY: ${{ secrets.GOOGLE_INDEXING_SA_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd backend
          python3 -c "
          import sys
          slugs = '${{ github.event.inputs.slugs }}'.split(',')
          slugs = [s.strip() for s in slugs if s.strip()]
          args = []
          for s in slugs:
              args.append(s)
          print(f'Deleting {len(args)} URLs...')
          sys.argv = ['batch_index', '--deleted'] + args
          from scripts.batch_index import main
          main()
          "

      - name: Submit updated sitemaps
        env:
          GOOGLE_INDEXING_SA_KEY: ${{ secrets.GOOGLE_INDEXING_SA_KEY }}
        run: |
          cd backend
          python -m scripts.submit_sitemaps

      - name: Summary
        if: always()
        run: |
          echo "## URL Deletion Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Date: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- Slugs: ${{ github.event.inputs.slugs }}" >> $GITHUB_STEP_SUMMARY
