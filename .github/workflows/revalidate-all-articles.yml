name: Revalidate All Articles (ISR)

on:
  workflow_dispatch:

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Invalidate /article/[slug] cache
        env:
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
        run: |
          curl -X POST "https://www.nexustopic.com/api/revalidate" \
            -H "Authorization: Bearer $REVALIDATION_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"all_articles": true}' \
            --fail-with-body
