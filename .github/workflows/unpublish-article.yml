name: Unpublish Article

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Article slug to unpublish'
        required: true

jobs:
  unpublish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Unpublish article (set published=false)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd backend
          python -c "
          from scripts.database import get_db_client
          db = get_db_client()
          slug = '${{ github.event.inputs.slug }}'
          result = db.update_article(slug, {'published': False})
          if result:
              print(f'✓ Unpublished: {slug}')
          else:
              print(f'✗ Failed to unpublish: {slug}')
              exit(1)
          "

      - name: Revalidate frontend cache
        env:
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          echo "Revalidating cache for slug: $SLUG"
          curl -s -X POST "https://www.nexustopic.com/api/revalidate" \
            -H "Authorization: Bearer $REVALIDATION_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"slug\": \"$SLUG\"}"

      - name: Wait for ISR propagation
        run: sleep 10

      - name: Google Indexing API (URL_DELETED)
        env:
          GOOGLE_INDEXING_SA_KEY: ${{ secrets.GOOGLE_INDEXING_SA_KEY }}
        run: |
          cd backend
          python -c "
          from scripts.notify_indexing import notify_urls
          slug = '${{ github.event.inputs.slug }}'
          url = f'https://www.nexustopic.com/article/{slug}'
          result = notify_urls([url], 'URL_DELETED')
          print(f'URL_DELETED result: {result}')
          " || true

      - name: Summary
        run: |
          echo "## Article Unpublished" >> $GITHUB_STEP_SUMMARY
          echo "- Slug: ${{ github.event.inputs.slug }}" >> $GITHUB_STEP_SUMMARY
          echo "- URL: https://www.nexustopic.com/article/${{ github.event.inputs.slug }}" >> $GITHUB_STEP_SUMMARY
