name: Debug Slug Query

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug to query'
        required: true
        default: '미국-전-부지사-아내-살해-후-자초한-비극-정치인-살인사건-전말은'

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install supabase client
        run: pip install supabase

      - name: Query articles + view for slug
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SLUG: ${{ github.event.inputs.slug }}
        run: |
          python - <<'PY'
          import os
          from supabase import create_client
          client = create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_SERVICE_KEY'])
          slug = os.environ['SLUG']
          print(f"Query slug: {slug!r}")
          print(f"len: {len(slug)}, bytes: {len(slug.encode('utf-8'))}")

          print("\n--- articles table ---")
          r1 = client.table('articles').select('slug, published, old_slug, title').eq('slug', slug).execute()
          print(f"rows: {len(r1.data)}")
          for row in r1.data:
              print(row)

          print("\n--- article_detail_view ---")
          r2 = client.table('article_detail_view').select('slug, published, title').eq('slug', slug).execute()
          print(f"rows: {len(r2.data)}")
          for row in r2.data:
              print(row)

          print("\n--- ilike partial match ---")
          r3 = client.table('articles').select('slug, published').ilike('slug', f'%{slug[:20]}%').execute()
          print(f"rows: {len(r3.data)}")
          for row in r3.data[:5]:
              print(row)

          print("\n--- sample 5 korean slugs ---")
          r4 = client.table('articles').select('slug, published').ilike('slug', '%-%').limit(5).execute()
          for row in r4.data:
              print(row['slug'][:80], '| published:', row['published'])
          PY
