name: Debug Slug Query

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug to query'
        required: true
        default: '미국-전-부지사-아내-살해-후-자초한-비극-정치인-살인사건-전말은'

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install supabase client
        run: pip install supabase requests

      - name: Service-role vs anon query comparison
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SLUG: ${{ github.event.inputs.slug }}
        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import requests

          url = os.environ['SUPABASE_URL']
          service_key = os.environ['SUPABASE_SERVICE_KEY']
          slug = os.environ['SLUG']

          # Fetch live site's anon key from HTML (exposed via _next chunks).
          # Fallback: parse from any public client page.
          print(f"=== slug: {slug!r}")

          # Query with service_role (bypasses RLS)
          def q(headers, label):
              for tbl in ('articles', 'article_detail_view'):
                  r = requests.get(
                      f"{url}/rest/v1/{tbl}",
                      params={'slug': f'eq.{slug}', 'select': 'slug,published'},
                      headers=headers,
                      timeout=10,
                  )
                  print(f"  [{label}] {tbl}: HTTP {r.status_code} rows={len(r.json()) if r.ok else '?'} body={r.text[:200]}")

          print("\n=== service_role ===")
          q({'apikey': service_key, 'Authorization': f'Bearer {service_key}'}, 'service')

          # Try to obtain an anon key from frontend HTML.
          print("\n=== fetch anon key from live site ===")
          html = requests.get('https://www.nexustopic.com/').text
          import re
          keys = re.findall(r'eyJhbGciOiJIUzI1[A-Za-z0-9._-]{100,}', html)
          if not keys:
              # Crawl chunks
              chunks = re.findall(r'/_next/static/chunks/[a-z0-9/\-_]+\.js', html)
              for ch in chunks[:15]:
                  try:
                      t = requests.get(f'https://www.nexustopic.com{ch}', timeout=10).text
                      keys = re.findall(r'eyJhbGciOiJIUzI1[A-Za-z0-9._-]{100,}', t)
                      if keys:
                          print(f"  Found in {ch}")
                          break
                  except Exception:
                      pass
          if keys:
              anon_key = keys[0]
              print(f"  anon_key (len {len(anon_key)}): {anon_key[:40]}...")
              print("\n=== anon ===")
              q({'apikey': anon_key, 'Authorization': f'Bearer {anon_key}'}, 'anon')
          else:
              print("  anon key not found in HTML")
          PY
