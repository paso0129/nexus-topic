name: Delete ALL Articles

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to confirm'
        required: true

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: cd backend && pip install -r requirements.txt

      - name: Delete all articles
        if: ${{ github.event.inputs.confirm == 'DELETE' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd backend
          python -c "
          from supabase import create_client
          import os
          client = create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_SERVICE_KEY'])
          result = client.table('articles').select('slug').execute()
          slugs = [r['slug'] for r in result.data]
          print(f'Found {len(slugs)} articles to delete')
          for slug in slugs:
              client.table('articles').delete().eq('slug', slug).execute()
              print(f'Deleted: {slug}')
          print(f'Done. {len(slugs)} articles deleted.')
          "
