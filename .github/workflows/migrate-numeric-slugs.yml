name: Migrate Numeric Slugs to Korean UTF-8

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - apply
      limit:
        description: 'Max articles to migrate (0 = all)'
        required: false
        default: '0'

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run migration (${{ github.event.inputs.mode }})
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd backend
          if [ "${{ github.event.inputs.mode }}" = "apply" ]; then
            python -m scripts.migrate_numeric_slugs --apply --limit ${{ github.event.inputs.limit }}
          else
            python -m scripts.migrate_numeric_slugs --limit ${{ github.event.inputs.limit }}
          fi

      - name: Upload redirect map
        uses: actions/upload-artifact@v4
        with:
          name: redirect-map
          path: backend/redirect_map.json
          if-no-files-found: warn

      - name: Revalidate frontend ISR cache
        if: github.event.inputs.mode == 'apply'
        env:
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
        run: |
          curl -X POST "https://www.nexustopic.com/api/revalidate" \
            -H "Authorization: Bearer $REVALIDATION_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"path":"/"}'

      - name: Notify search engines (IndexNow + WebSub)
        if: github.event.inputs.mode == 'apply'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd backend
          python -m scripts.notify_search_engines

      - name: Submit new URLs to Google Indexing API
        if: github.event.inputs.mode == 'apply'
        env:
          GOOGLE_INDEXING_SA_KEY: ${{ secrets.GOOGLE_INDEXING_SA_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd backend
          python -m scripts.batch_index
