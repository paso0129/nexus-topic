name: Add 3-Line Summary to Articles

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run or apply'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - apply
      limit:
        description: 'Max articles to process (0 = all)'
        required: false
        default: '0'
      offset:
        description: 'Skip first N articles'
        required: false
        default: '0'
      only_missing:
        description: 'Only articles that are missing a summary block'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: add-three-line-summary
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run migration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd backend
          ARGS=""
          if [ "${{ github.event.inputs.mode }}" = "apply" ]; then
            ARGS="$ARGS --apply"
          fi
          if [ "${{ github.event.inputs.only_missing }}" = "true" ]; then
            ARGS="$ARGS --only-missing"
          fi
          LIMIT="${{ github.event.inputs.limit }}"
          OFFSET="${{ github.event.inputs.offset }}"
          if [ "$LIMIT" != "0" ] && [ -n "$LIMIT" ]; then
            ARGS="$ARGS --limit $LIMIT"
          fi
          if [ "$OFFSET" != "0" ] && [ -n "$OFFSET" ]; then
            ARGS="$ARGS --offset $OFFSET"
          fi
          echo "Running: python -m scripts.add_three_line_summary $ARGS"
          python -m scripts.add_three_line_summary $ARGS

      - name: Revalidate all article pages
        if: ${{ github.event.inputs.mode == 'apply' }}
        env:
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
        run: |
          if [ -z "$REVALIDATION_SECRET" ]; then
            echo "REVALIDATION_SECRET not set — skipping revalidation"
            exit 0
          fi
          curl -sS -X POST https://www.nexustopic.com/api/revalidate \
            -H "Authorization: Bearer $REVALIDATION_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"all_articles": true}' | head -c 500
          echo ""
